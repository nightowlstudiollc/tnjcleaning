name: Netlify Site Checks

# Replaces verify-deploy-preview.yml (#45). Runs scripts/check-deploy-preview.sh on PR previews and the pushed SHA's prod deploy.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

jobs:
  netlify-site-checks:
    uses: smartwatermelon/github-workflows/.github/workflows/netlify-site-checks.yml@netlify-site-checks-v1
    with:
      netlify-site: tnjcleaning
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
